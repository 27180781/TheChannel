name: deploy

# Builds TheChannel on GitHub and hands CapRover a tarball of ready files.
# The Angular build stalled on the CapRover host (memory), so the server no
# longer builds anything: deploy/Dockerfile.release only copies.
#
# Needs two repository secrets: CAPROVER_SERVER (the dashboard URL, e.g.
# https://captain.example.com) and CAPROVER_APP_TOKEN (the app's Deployment
# tab → Enable App Token). Without them the job stops with a clear message.

on:
  push:
    branches: [master]
  # A pull request that touches the release path builds and assembles it,
  # without deploying, so a broken release fails before it reaches master.
  pull_request:
    paths:
      - .github/workflows/deploy.yml
      - deploy/**
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.event_name }}
  cancel-in-progress: false

env:
  CAPROVER_APP: thechannel

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        if: github.event_name != 'pull_request'
        env:
          SERVER: ${{ secrets.CAPROVER_SERVER }}
          TOKEN: ${{ secrets.CAPROVER_APP_TOKEN }}
        run: |
          if [ -z "$SERVER" ] || [ -z "$TOKEN" ]; then
            echo "::error::CAPROVER_SERVER and CAPROVER_APP_TOKEN must be set in the repository secrets"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Build backend
        working-directory: backend
        # Static, so the binary runs on any debian:latest base.
        env:
          CGO_ENABLED: "0"
        run: go build -o ../release/the-channel .

      - name: Assemble the release
        run: |
          mkdir -p release/assets
          cp -r backend/assets/. release/assets/
          # As the root Dockerfile does: the platform favicon comes from the frontend build.
          cp frontend/dist/channel/browser/favicon.ico release/assets/
          cp -r frontend/dist/channel/browser release/ng
          cp deploy/Dockerfile.release release/Dockerfile
          printf '{\n  "schemaVersion": 2,\n  "dockerfilePath": "./Dockerfile"\n}\n' > release/captain-definition
          tar -C release -cf release.tar .
          ls -la release

      - name: Deploy to CapRover
        if: github.event_name != 'pull_request'
        env:
          SERVER: ${{ secrets.CAPROVER_SERVER }}
          TOKEN: ${{ secrets.CAPROVER_APP_TOKEN }}
        run: npx --yes caprover@2 deploy --caproverUrl "$SERVER" --appToken "$TOKEN" --appName "$CAPROVER_APP" --tarFile release.tar
