<nb-card>
  <nb-card-header class="d-flex align-items-center gap-2">
    <nb-icon icon="settings-2-outline"></nb-icon>
    <span>תכונות ערוץ: <strong>{{ slug }}</strong></span>
  </nb-card-header>

  <nb-card-body>
    <div class="d-flex flex-column gap-3">
      @for (config of featureConfigs; track config.key) {
        @if (config.destructive) {
          <div class="feature-row feature-row--destructive">
            <div class="d-flex align-items-center gap-2">
              <nb-icon icon="alert-triangle-outline" class="feature-row__warn"></nb-icon>
              <nb-toggle
                status="danger"
                [checked]="features[config.key]"
                (checkedChange)="features[config.key] = $event">
                <span class="feature-row__label">{{ config.label }}</span>
              </nb-toggle>
            </div>
            @if (config.description) {
              <p class="feature-row__desc">{{ config.description }}</p>
            }
          </div>
        } @else {
          <div class="d-flex align-items-center gap-2">
            <nb-toggle
              [checked]="features[config.key]"
              (checkedChange)="features[config.key] = $event">
              <span>{{ config.label }}</span>
            </nb-toggle>
          </div>
        }
      }
    </div>
  </nb-card-body>

  <nb-card-footer>
    <button nbButton status="primary" (click)="save()" [disabled]="saving">
      <nb-icon icon="save-outline"></nb-icon>
      {{ saving ? 'שומר...' : 'שמור תכונות' }}
    </button>
  </nb-card-footer>
</nb-card>
